[package]
name = "sqleq-fuzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "License-clean concrete differential tester: a SQL non-equivalence disprover (PostgreSQL)"
license = "Apache-2.0"
publish = false

[lib]
name = "sqleq_fuzz"
path = "src/lib.rs"

[[bin]]
name = "sqleq-fuzz"
path = "src/main.rs"

[dependencies]
# DuckDB, linked against the project's own release library -- which, unlike the crates.io
# `bundled` amalgamation, has the icu, json and parquet extensions compiled into it. The
# workspace's .cargo/config.toml is what tells the build script to fetch it.
duckdb = { version = "1" }
# Query/schema parsing (same parser the frontend uses) — `visitor` for relation discovery.
sqlparser = { workspace = true, features = ["visitor"] }
# Pattern matching for time-freezing, LIMIT/param detection, and the UNIQUE-INDEX regex fallback.
regex = "1"
# Deterministic, seedable RNG for instance/parameter generation.
rand = "0.10"
# Robust CSV reader for the corpus (DDL cells contain quoted, multi-line SQL).
csv = { workspace = true }
# Batch verdict output.
serde_json = { workspace = true }
# The Postgres engine's client: synchronous, matching the std::thread pool.
postgres = "0.19"

# The build script fetches the PostgreSQL the Postgres engine runs on (build.rs): a download, its
# SHA-256 check, and the archive's unpacking. These are the versions and features the workspace
# already builds, for `libduckdb-sys`'s own download and the Postgres client.
[build-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
