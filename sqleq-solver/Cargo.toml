[package]
name = "sqleq-solver"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust rewrite of SQLSolver's equivalence-checking proof engine"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "sqleq_solver"
path = "src/lib.rs"

# IrDriver's command line and JSONL contract, so a harness drives either one; see src/main.rs.
[[bin]]
name = "sqleq-solver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# "unbounded_depth": real IR nests past serde_json's default 128-level recursion limit (long
# AND/OR/CAST chains), which is ordinary input, not adversarial.
serde_json = { workspace = true, features = ["unbounded_depth"] }

# The same fork (and pinned commit) the QED prover uses for its Z3 bindings -- a version already
# known to build and link against a system libz3, rather than the current upstream `z3`/`z3-sys`
# crates untested. Pinned by `rev` rather than tracking the branch
# head, so this crate can't silently drift onto a different resolved commit than the one this was
# built and validated against.
z3 = { git = "https://github.com/wsx-ucb/z3.rs", rev = "255189446ce4ac65627229ce3bd5e97d7d781cec" }
