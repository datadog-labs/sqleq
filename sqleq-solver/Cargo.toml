[package]
name = "sqleq-solver"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port of SQLSolver's equivalence-checking proof engine"
license = "Apache-2.0"
publish = false

[lib]
name = "sqleq_solver"
path = "src/lib.rs"

# IrDriver's command line and JSONL contract over the Rust port; see src/main.rs.
[[bin]]
name = "sqleq-solver"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# "unbounded_depth": real IR nests past serde_json's default 128-level recursion limit (long
# AND/OR/CAST chains), which is ordinary input, not adversarial.
serde_json = { workspace = true, features = ["unbounded_depth"] }

# "vendored": Z3 itself is compiled from the source crate `z3-src` (checksum-pinned in Cargo.lock)
# and linked statically, so there is no Z3 to install and nothing to find at run time. The first
# build compiles Z3 and needs cmake and a C++20 compiler.
z3 = { version = "0.21.1", features = ["vendored"] }
