# Five jobs, split on build cost rather than on subject.
#
# `sqleq-fuzz` links DuckDB, whose release library its first build downloads -- a much larger
# cache than anything else here -- `sqleq-solver` compiles Z3, and `sqleq-lean` needs a Lean
# toolchain, the largest download of all. Keeping each in its own job means
# the frontend's answer -- the one that gates most changes -- arrives in under a minute, and the
# caches do not evict each other. Each job lints the crate it builds, so the union is
# `cargo clippy --workspace` without any job paying for another's dependencies.
#
# Three of them also run the pinned pairs under tests/pairs on the axes they build: the frontend,
# sqleq-fuzz and sqleq-solver. The QED prover and the JVM fork of SQLSolver are never installed
# here, so their pins are checked where those tools exist -- see tests/pairs/README.md.
#
# `licenses` builds nothing. It checks that every dependency is under a permissive licence and
# that LICENSE-3rdparty.csv still matches Cargo.lock, so a dependency cannot change without its
# attribution changing with it.
#
# Deliberately absent: `cargo fmt`. There is no `rustfmt.toml`, over a thousand source lines
# already run past 100 columns, and `src/dml.rs` has never been formatted, so a format gate would
# rewrite the tree rather than check it. See CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes anything back to the repository, so the token gets read access and nothing else.
permissions:
  contents: read

# `-D warnings` lives on the clippy invocations, not in `RUSTFLAGS`: a global `RUSTFLAGS`
# reaches dependency crates too, so an upstream release that adds one warning would break
# this repo's CI. Clippy runs rustc's own lints, so nothing is lost by scoping it.
env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend + tools
    runs-on: ubuntu-latest
    # Each integration test is its own binary, and at full debug info each one links to a few hundred
    # MB on top of a restored `target/`. Past the runner's disk the linker dies of SIGBUS writing its
    # mapped output, not with a clean "no space" error. Line tables keep file and line in a panic's
    # backtrace, which is all a CI log reads, and incremental state is never reused on a fresh runner.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Actions are pinned to a full-length commit SHA with the release tag alongside. A tag
      # is mutable, so a compromised one re-points silently, and some organisations reject
      # unpinned actions outright. Bump the SHA and its comment together.
      #
      # `persist-credentials: false` keeps the token out of `.git/config`, where every later step
      # could read it; nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's preinstalled stable toolchain, on purpose: a third-party toolchain action is
      # one more thing an organisation has to allowlist, and this workspace pins no nightly
      # features. `rust-version = "1.85"` is the floor; an MSRV job can be added later.
      - run: rustc --version && cargo --version

      # The prefix names the build settings in the job's `env`. A `target/` built under other
      # settings is restored in full but none of it is reused, and with it on disk the runner has no
      # room left to archive the new one, so the cache is never replaced. Change the prefix whenever
      # those settings change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: frontend-lines-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: frontend-lines-${{ runner.os }}-

      # `default-members = ["."]`, so these two cover the frontend crate and nothing else.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

      # The `internals` feature is off by default, so the two lines above never compile it.
      # Without this step it would rot silently until the benchmark harness that depends on it
      # failed to build against a new frontend.
      - run: cargo clippy --features internals --all-targets -- -D warnings

      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      # The pinned pairs on the frontend axis. A non-equivalent pair that lowers to the same IR on
      # both sides fails here, with no prover anywhere in the job.
      - run: cargo build --bin sqleq-frontend
      - name: pinned pairs (frontend)
        run: |
          test -x target/debug/sqleq-frontend
          python3 tools/sqleq_check.py --expect pinned --axes frontend \
            --frontend target/debug/sqleq-frontend tests/pairs examples/*.sql

      # Every relative link in every tracked Markdown file resolves. See tools/linkcheck.py for
      # why this is a gate and not a habit.
      - run: python3 tools/linkcheck.py

      # No path from the machine something was developed on survives into the tree. On a GitHub
      # runner such a path cannot exist, which is exactly what makes the check worth running here.
      # The pattern is written as a character class rather than as a literal username so that this
      # file does not match its own gate.
      - name: no developer-machine paths
        run: |
          if git grep -nE '(/home|/Users)/[a-z]' -- . ; then
            echo "::error::an absolute home-directory path is committed; make it a flag or a \$SQLEQ_* variable"
            exit 1
          fi

  fuzz:
    name: sqleq-fuzz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version

      # Keyed separately from the frontend: this cache also carries the downloaded DuckDB library.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      # The build script downloads DuckDB's release library and verifies no checksum on it. This
      # org requires every Action to be pinned to a commit SHA; a 40 MB binary that gets linked
      # into the test executable deserves the same, so fetch it here and check its digest. The
      # build script reuses an archive that is already in place, so this only ever replaces its
      # own download.
      #
      # The version is derived from Cargo.lock rather than written out, because the build script
      # decides to reuse by looking for the *extracted* library: a stale path here would silently
      # fall through to an unverified download instead of failing. Derived, a crate bump fails the
      # digest check loudly, which is how it should be found.
      - name: fetch libduckdb (digest-pinned)
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import re;s=open("Cargo.lock").read();e=int(re.search(r"libduckdb-sys.\nversion = .1\.(\d+)\.",s).group(1));print(f"{e//10000}.{e//100%100}.{e%100}")')
          dir="target/duckdb-download/x86_64-unknown-linux-gnu/$ver"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/libduckdb-linux-amd64.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v$ver/libduckdb-linux-amd64.zip"
          echo "1fb8ce388157d84a25abe685a8a2520bf00c00321821968e4bb398fd766e7abb  $dir/libduckdb-linux-amd64.zip" \
            | sha256sum -c -

      - run: cargo test -p sqleq-fuzz
      - run: cargo clippy -p sqleq-fuzz --all-targets -- -D warnings

      # The pinned pairs on the only axis that refutes. It reads each pair file itself, so it needs
      # no frontend.
      - run: cargo build -p sqleq-fuzz --bin sqleq-fuzz
      - name: pinned pairs (fuzz)
        run: |
          test -x target/debug/sqleq-fuzz
          python3 tools/sqleq_check.py --expect pinned --axes fuzz \
            --fuzz-bin target/debug/sqleq-fuzz tests/pairs examples/*.sql

  licenses:
    name: licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every source file opens with the licence header in CONTRIBUTING.md. Only the first six
      # lines are read, so a file cannot pass by quoting the header further down -- which is also
      # why this file, which quotes it here, has to carry the header itself.
      - name: licence headers
        run: |
          missing=$(git ls-files '*.rs' '*.py' '*.java' '*.toml' '*.yml' '*.sql' '*.sh' \
            | while read -r f; do head -n 6 "$f" | grep -qF 'Copyright 2026-Present Datadog, Inc.' || echo "$f"; done)
          if [ -n "$missing" ]; then
            echo "::error::these files do not start with the licence header (see CONTRIBUTING.md):"
            echo "$missing"
            exit 1
          fi

      # Only the two binaries, not all of ~/.cargo/bin: restoring that directory would also put back
      # stale copies of the runner's own rustup proxies. Bump a version here and in the key together.
      - id: license-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/dd-rust-license-tool
          key: license-tools-${{ runner.os }}-cargo-deny-0.20.2-dd-rust-license-tool-1.0.6
      - if: steps.license-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked dd-rust-license-tool --version 1.0.6

      # `--workspace`: the root manifest is also the frontend package, so without it the fuzz and
      # solver crates' dependencies are never looked at. See deny.toml.
      - run: cargo deny --workspace check licenses

      # Invoked through `sh` so it does not depend on the file's executable bit.
      - run: sh tools/update_license_3rdparty.sh --check

  solver:
    name: sqleq-solver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The prefix names how Z3 is built: `[profile.dev.package.z3-sys]` in Cargo.toml. A key
          # that matches exactly is never saved again, so a `target/` holding a Z3 built another way
          # would be restored and recompiled on every run. Change the prefix whenever that changes.
          key: solver-z3release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: solver-z3release-${{ runner.os }}-

      # Z3 is compiled from the `z3-src` crate, whose checksum Cargo.lock pins, and linked
      # statically; the cache above keeps that compile to the first build after a lockfile change.
      # It needs cmake and a C++20 compiler, which the runner image provides.
      - run: cmake --version && c++ --version

      - run: cargo test -p sqleq-solver
      - run: cargo clippy -p sqleq-solver --all-targets -- -D warnings

      # The frontend job runs the harness tests too, but without this binary the one that drives
      # the second opinion through it skips. Here it must run, so the binary's presence is asserted
      # first and the test is named.
      - run: cargo build -p sqleq-solver --bin sqleq-solver
      - name: second opinion through sqleq-solver
        run: |
          test -x target/debug/sqleq-solver
          cd tools && python3 -m unittest -v test_sqleq_check.SecondOpinionThroughSqleqSolver

      # The pinned pairs on sqleq-solver. It proves from the frontend's IR, so this job builds the
      # frontend binary too; the frontend's own pins are checked again on the way, at no extra cost.
      - run: cargo build --bin sqleq-frontend
      - name: pinned pairs (sqleq-solver)
        run: |
          python3 tools/sqleq_check.py --expect pinned --axes sqleq-solver \
            --frontend target/debug/sqleq-frontend --sqleq-solver-bin target/debug/sqleq-solver \
            tests/pairs examples/*.sql

  lean:
    name: sqleq-lean
    runs-on: ubuntu-latest
    env:
      # The release `lean/lean-toolchain` names; the first step below checks the two agree. Bump the
      # version, that file and the digest together.
      LEAN_VERSION: 4.34.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'lean/lean-toolchain', 'lean/**/*.lean') }}
          restore-keys: lean-${{ runner.os }}-

      # The toolchain itself, cached apart from the build because it is large (the archive is over
      # half a gigabyte) and changes only with the version. The key carries the digest, so a cached
      # copy can only have come from an archive that passed the check below.
      - id: lean-toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lean-toolchain
          key: lean-toolchain-${{ runner.os }}-4.34.1-47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4

      # No elan and no toolchain action: the release archive carries `lean` and `lake`, and putting
      # its `bin` on PATH is all `lake build` and sqleq-lean need. Pinned by digest like Z3 below:
      # the value is the SHA-256 GitHub lists for the release asset, so a replaced upload fails the
      # build.
      - name: fetch Lean (digest-pinned)
        run: |
          set -euo pipefail
          test "$(cat lean/lean-toolchain)" = "leanprover/lean4:v$LEAN_VERSION"
          name="lean-$LEAN_VERSION-linux"
          dir="$HOME/.cache/lean-toolchain"
          if [ ! -x "$dir/$name/bin/lake" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.zst" \
              "https://github.com/leanprover/lean4/releases/download/v$LEAN_VERSION/$name.tar.zst"
            echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/$name.tar.zst" \
              | sha256sum -c -
            mkdir -p "$dir"
            tar --zstd -xf "$RUNNER_TEMP/$name.tar.zst" -C "$dir"
            rm "$RUNNER_TEMP/$name.tar.zst"
          fi
          echo "$dir/$name/bin" >> "$GITHUB_PATH"

      # The library, and the checker's controls: pairs it must accept or refuse, with kernel-checked
      # counterexamples for the refusals that are genuine non-equivalences.
      - name: Lean library and controls
        run: cd lean && lake build Sqleq SqleqTest

      # The integration test runs every pinned pair under tests/pairs that pins the Lean axis through
      # real Lean and asserts
      # the verdict its header declares; it fails, rather than skips, without `lake` on PATH.
      - run: cargo test -p sqleq-lean
      - run: cargo clippy -p sqleq-lean --all-targets -- -D warnings
