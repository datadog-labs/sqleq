# Two jobs, split on build cost rather than on subject.
#
# `sqleq-fuzz` links DuckDB, whose release library its first build downloads -- a much larger
# cache than anything else here. Keeping it in its own job means the frontend's answer
# -- the one that gates most changes -- arrives in under a minute, and the two caches do not evict
# each other. Each job lints the crate it builds, so the union is `cargo clippy --workspace`
# without either job paying for the other's dependencies.
#
# Deliberately absent: `cargo fmt`. There is no `rustfmt.toml`, over a thousand source lines
# already run past 100 columns, and `src/dml.rs` has never been formatted, so a format gate would
# rewrite the tree rather than check it. See CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes anything back to the repository, so the token gets read access and nothing else.
permissions:
  contents: read

# `-D warnings` lives on the clippy invocations, not in `RUSTFLAGS`: a global `RUSTFLAGS`
# reaches dependency crates too, so an upstream release that adds one warning would break
# this repo's CI. Clippy runs rustc's own lints, so nothing is lost by scoping it.
env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend + tools
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full-length commit SHA with the release tag alongside. A tag
      # is mutable, so a compromised one re-points silently, and some organisations reject
      # unpinned actions outright. Bump the SHA and its comment together.
      #
      # `persist-credentials: false` keeps the token out of `.git/config`, where every later step
      # could read it; nothing here pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner's preinstalled stable toolchain, on purpose: a third-party toolchain action is
      # one more thing an organisation has to allowlist, and this workspace pins no nightly
      # features. `rust-version = "1.85"` is the floor; an MSRV job can be added later.
      - run: rustc --version && cargo --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: frontend-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: frontend-${{ runner.os }}-

      # `default-members = ["."]`, so these two cover the frontend crate and nothing else.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

      # The `internals` feature is off by default, so the two lines above never compile it.
      # Without this step it would rot silently until the benchmark harness that depends on it
      # failed to build against a new frontend.
      - run: cargo clippy --features internals --all-targets -- -D warnings

      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      # Every relative link in every tracked Markdown file resolves. See tools/linkcheck.py for
      # why this is a gate and not a habit.
      - run: python3 tools/linkcheck.py

      # No path from the machine something was developed on survives into the tree. On a GitHub
      # runner such a path cannot exist, which is exactly what makes the check worth running here.
      # The pattern is written as a character class rather than as a literal username so that this
      # file does not match its own gate.
      - name: no developer-machine paths
        run: |
          if git grep -nE '(/home|/Users)/[a-z]' -- . ; then
            echo "::error::an absolute home-directory path is committed; make it a flag or a \$SQLEQ_* variable"
            exit 1
          fi

  fuzz:
    name: sqleq-fuzz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustc --version && cargo --version

      # Keyed separately from the frontend: this cache also carries the downloaded DuckDB library.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      # The build script downloads DuckDB's release library and verifies no checksum on it. This
      # org requires every Action to be pinned to a commit SHA; a 40 MB binary that gets linked
      # into the test executable deserves the same, so fetch it here and check its digest. The
      # build script reuses an archive that is already in place, so this only ever replaces its
      # own download.
      #
      # The version is derived from Cargo.lock rather than written out, because the build script
      # decides to reuse by looking for the *extracted* library: a stale path here would silently
      # fall through to an unverified download instead of failing. Derived, a crate bump fails the
      # digest check loudly, which is how it should be found.
      - name: fetch libduckdb (digest-pinned)
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import re;s=open("Cargo.lock").read();e=int(re.search(r"libduckdb-sys.\nversion = .1\.(\d+)\.",s).group(1));print(f"{e//10000}.{e//100%100}.{e%100}")')
          dir="target/duckdb-download/x86_64-unknown-linux-gnu/$ver"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/libduckdb-linux-amd64.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v$ver/libduckdb-linux-amd64.zip"
          echo "1fb8ce388157d84a25abe685a8a2520bf00c00321821968e4bb398fd766e7abb  $dir/libduckdb-linux-amd64.zip" \
            | sha256sum -c -

      - run: cargo test -p sqleq-fuzz
      - run: cargo clippy -p sqleq-fuzz --all-targets -- -D warnings
