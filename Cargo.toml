[package]
name = "sqleq"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Decides whether two SQL queries are equivalent, meaning they always return the same results. Aims to return a proof when they are equivalent or a concrete counterexample when they are not."
license = "Apache-2.0"
repository = "https://github.com/datadog-labs/sqleq"
homepage = "https://github.com/datadog-labs/sqleq"
readme = "README.md"
keywords = ["sql", "sql-equivalence", "formal-verification", "smt", "query-optimization"]
categories = ["database", "development-tools::testing", "command-line-utilities"]
# What the published crate carries: the sources, the build script, and the licence and notice files
# a distributed package must ship. Not the tests, the Lean package, the tools or the docs; the Lean
# package's absence is also how an installed sqleq-check tells it is not in a checkout.
include = ["/src", "/build.rs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/LICENSE-3rdparty.csv"]
# Every binary is listed below, with the feature it needs.
autobins = false

# docs.rs builds without the network and within a time limit: the frontend, sqleq-check, the IR reader
# and sqleq-fuzz, without Z3's source build or DuckDB's download.
[package.metadata.docs.rs]
no-default-features = true
features = ["fuzz"]

[lib]
name = "sqleq"
path = "src/lib.rs"

# One crate, with a cargo feature for each heavy build, so a build pays only for what it asks for.
# The defaults are the frontend, sqleq-check, sqleq-solver and sqleq-fuzz; `--no-default-features`
# is the light build: the frontend and sqleq-check, the batch harness, which runs every other
# binary as a subprocess and so needs none of them.
[features]
default = ["solver", "fuzz"]
# sqleq-solver compiles Z3 from source on its first build.
solver = ["dep:z3"]
# sqleq-fuzz links DuckDB, whose release library its first build downloads, and fetches the
# PostgreSQL its default engine runs on (build.rs).
fuzz = ["dep:postgres", "dep:rand", "dep:regex", "dep:ureq", "dep:sha2", "dep:flate2", "dep:tar"]
# sqleq-fuzz's other engine, DuckDB, off by default: its library is linked from a download that only
# this repository's .cargo/config.toml asks for, so a build from the published crate would not link.
duckdb = ["fuzz", "dep:duckdb"]
# sqleq-lean needs a Lean toolchain at run time, and reads the frontend's internals.
lean = ["internals"]
# sqleq-cvc5 links a cvc5 library (`CVC5_LIB_DIR`). It reads plans through `ir`, not the solver, so
# it builds without Z3.
cvc5 = ["dep:cvc5"]
# Off by default. Exposes lowering internals to sqleq's own benchmark harness, which audits a
# corpus that cannot be published and so cannot live in this repository. Exempt from semver.
internals = []

[[bin]]
name = "sqleq-frontend"
path = "src/main.rs"

[[bin]]
name = "sqleq-check"
path = "src/bin/sqleq-check.rs"

[[bin]]
name = "sqleq-fuzz"
path = "src/bin/sqleq-fuzz.rs"
required-features = ["fuzz"]

[[bin]]
name = "sqleq-solver"
path = "src/bin/sqleq-solver.rs"
required-features = ["solver"]

[[bin]]
name = "sqleq-lean"
path = "src/bin/sqleq-lean.rs"
required-features = ["lean"]

[[bin]]
name = "sqleq-cvc5"
path = "src/bin/sqleq-cvc5.rs"
required-features = ["cvc5"]

[dependencies]
# `unbounded_depth`: real IR nests past serde_json's default 128-level recursion limit (long
# AND/OR/CAST chains), which is ordinary input, not adversarial. `ir` needs it, and a feature of a
# dependency applies to the whole crate.
serde_json = { version = "1", features = ["unbounded_depth"] }
# `visitor` gives us the derived AST walker. It is used for the "is this expression closed?"
# guards, where a hand-written match risks *missing* a variant — and a missed variant there is a
# soundness hole, not a coverage gap. sqleq-fuzz uses it for relation discovery.
sqlparser = { version = "0.64", features = ["visitor"] }
# Robust CSV reader for the corpus: the DDL field holds quoted, multi-line SQL.
csv = "1"
# Postgres's own grammar (libpg_query, compiled from the Postgres source it vendors). It decides
# whether a refusal is `parse`: text Postgres cannot parse, as opposed to Postgres syntax this
# frontend's parser does not read. See `FrontendError::Parse`.
pg_query = "6.2"
# sqleq-check's command line.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Process groups: `killpg` at a deadline, and on Ctrl-C, takes a backend's own children with it.
libc = "0.2"
serde = { version = "1", features = ["derive"] }

# sqleq-fuzz. DuckDB, linked against the project's own release library -- which, unlike the
# crates.io `bundled` amalgamation, has the icu, json and parquet extensions compiled into it. The
# repository's .cargo/config.toml is what tells the build script to fetch it.
duckdb = { version = "1", optional = true }
# Pattern matching for time-freezing, LIMIT/param detection, and the UNIQUE-INDEX regex fallback.
regex = { version = "1", optional = true }
# Deterministic, seedable RNG for instance/parameter generation.
rand = { version = "0.10", optional = true }
# The Postgres engine's client: synchronous, matching the std::thread pool.
postgres = { version = "0.19", optional = true }

# sqleq-solver. "vendored": Z3 itself is compiled from the source crate `z3-src` (checksum-pinned in
# Cargo.lock) and linked statically, so there is no Z3 to install and nothing to find at run time.
# The first build compiles Z3 and needs cmake and a C++20 compiler whose standard library has
# `<format>` (GCC 13 or newer). Z3 is built optimised in every profile
# (`[profile.dev.package.z3-sys]`).
z3 = { version = "0.22.0", features = ["vendored"], optional = true }

# sqleq-cvc5. The cvc5 bindings (https://github.com/cvc5/cvc5-rs). Without their `static` feature
# they link the cvc5 library that `CVC5_LIB_DIR` names and read its headers from `CVC5_INCLUDE_DIR`
# or `$CVC5_LIB_DIR/../include`; build.rs adds that directory to the binary's rpath. The library must
# be 1.4.0 or later, and this axis is written against the `bags-algebra` branch
# (https://github.com/mudathirmahgoub/cvc5/pull/27), whose bag reasoning it exercises:
# `sh tools/build_cvc5.sh` builds it under target/cvc5/, where .cargo/config.toml points
# CVC5_LIB_DIR.
cvc5 = { version = "0.6.1", optional = true }

# sqleq-fuzz's build script fetches the PostgreSQL the Postgres engine runs on (build.rs): a
# download, its SHA-256 check, and the archive's unpacking. These are the versions and features the
# crate already builds, for `libduckdb-sys`'s own download and the Postgres client.
[build-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

