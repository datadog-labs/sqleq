name = "sqleq"
version = "0.1.0"
defaultTargets = ["Sqleq"]

# Core Lean only. No Mathlib: the per-pair proofs are computed by the kernel, which needs
# plain inductives and structural recursion, not a large lemma library.
[[lean_lib]]
name = "Sqleq"

# Checker controls: positive pairs the checker must pass, negative ones it must refuse.
[[lean_lib]]
name = "SqleqTest"
globs = ["SqleqTest.+"]
